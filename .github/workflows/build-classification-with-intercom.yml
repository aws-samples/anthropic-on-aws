name: build-classification-with-intercom
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - classification-with-intercom/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install dependencies
        run: yarn install --check-files
        working-directory: classification-with-intercom
      - name: Build
        run: yarn build
        working-directory: classification-with-intercom
      - name: Fail if build modified tracked files
        run: |
          git add .
          if ! git diff --staged --exit-code; then
            echo "::error::Files were changed during build (see diff above). Commit the changes and push again."
            exit 1
          fi
