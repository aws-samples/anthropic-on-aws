name: build-complex-schema-tool-use-nextjs
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - complex-schema-tool-use/nextjs-typescript-example/**
  workflow_dispatch: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        run: yarn install --check-files
        working-directory: complex-schema-tool-use/nextjs-typescript-example
      - name: Build
        run: yarn build
        working-directory: complex-schema-tool-use/nextjs-typescript-example
      - name: Fail if build modified tracked files
        run: |
          git add .
          if ! git diff --staged --exit-code; then
            echo "::error::Files were changed during build (see diff above). Commit the changes and push again."
            exit 1
          fi
